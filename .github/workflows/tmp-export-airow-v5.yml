name: Export AIROW 5 source
on:
  workflow_dispatch:
  push:
    branches: [tmp-airow-neural-500-build]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        shell: bash
        run: |
          tar -czf airow-v5-source.tar.gz -C tmp/airow-flux-410/work .
      - uses: actions/upload-artifact@v4
        with:
          name: airow-v5-source
          path: airow-v5-source.tar.gz
