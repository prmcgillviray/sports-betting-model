name: Temporary AIROW Neural 5.0 Build
on:
  push:
    branches: [tmp-airow-neural-500-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate source
        working-directory: tmp/airow-flux-410/work
        shell: bash
        run: |
          grep -q 'versionCode="50000"' AndroidManifest.xml
          grep -q 'versionName="5.0.0"' AndroidManifest.xml
          grep -q 'class NeuralHome' src/com/airow/launcher/NeuralHome.java
          grep -q 'class NeuralCanvas' src/com/airow/launcher/NeuralCanvas.java
          grep -q 'class NeuralHaloView' src/com/airow/launcher/NeuralHaloView.java
          grep -q 'new NeuralHome' src/com/airow/launcher/MainActivity.java
          ! grep -R -q 'postInvalidateDelayed' src/com/airow/launcher
      - name: Build and test
        working-directory: tmp/airow-flux-410/work
        run: |
          rm -f airow-development.p12
          keytool -genkeypair -keystore airow-development.p12 -storetype PKCS12 -storepass android -keypass android -alias airow-dev -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Temporary CI Build"
          python3 build.py
          python3 test.py
      - name: Package build
        shell: bash
        run: |
          mkdir artifact
          cp tmp/airow-flux-410/work/build/aligned.apk artifact/AIROW-Home-5.0.0-aligned-unsigned.apk
          cp tmp/airow-flux-410/work/output/AIROW-Home-5.0.0.apk artifact/AIROW-Home-5.0.0-temp-signed.apk
          find tmp/airow-flux-410/work/tool-cache/tools -name apksigner.jar -exec cp {} artifact/apksigner.jar \;
          AAPT2=$(find tmp/airow-flux-410/work/tool-cache/tools -type f -name aapt2 | head -n 1)
          "$AAPT2" dump badging tmp/airow-flux-410/work/build/aligned.apk > artifact/build-info.txt
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: airow-neural-500-build
          path: artifact/
          if-no-files-found: error
